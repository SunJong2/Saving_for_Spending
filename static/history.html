<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>히스토리</title>
    <link rel="stylesheet" href="style.css">
    <!-- 파비콘 -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7C4DFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="모아사">
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
        }
    </script>
</head>
<body>
    <div class="container has-tabbar">
        <div class="header">
            <span class="header-title">히스토리</span>
        </div>
        <!-- 히스토리가 있을 때 보여줄 영역 (기본 숨김) -->
        <div id="historySection" style="display: none;">
            <div style="margin-top: 24px; margin-bottom: 32px;">
                <h1 class="title-lg">지금까지<br>해낸 것들 🏆</h1>
            </div>

            <!-- 카테고리별 절약 통계 (기록 없으면 JS가 숨김) -->
            <div id="statsBlock">
                <h2 class="section-title">카테고리별로 아낀 돈</h2>
                <div id="statsList"></div>
            </div>

            <h2 class="section-title" style="margin-top: 32px;">달성 기록</h2>
            <div id="historyList"></div>
        </div>

        <!-- 히스토리가 없을 때 보여줄 영역 (기본 숨김) -->
        <div id="noHistorySection" style="display: none; text-align: center; margin-top: 90px;">
            <div style="font-size: 64px;">🎯</div>
            <h1 class="title-lg" style="margin-top: 16px;" id="noHistoryTitle">아직 달성한 목표가 없어요</h1>
            <p class="text-sub" style="margin: 12px 0 32px;" id="noHistorySub">목표를 세우고 아껴서 가져보세요</p>
            <button class="btn-primary" id="noHistoryBtn" onclick="location.href='add-goal.html'">
                첫 목표 만들기
            </button>
        </div>
    </div>

    <div class="tabbar">
        <button class="tab" onclick="location.href='index.html'">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            홈
        </button>
        <button class="tab active" onclick="location.href='history.html'">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2"/>
                <path d="M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2"/>
                <path d="M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3"/>
                <path d="M4 22h16"/><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/>
                <path d="M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3"/>
            </svg>
            히스토리
        </button>
    </div>

    <!-- 목표별 절약 기록 모달 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card" style="text-align: left; max-height: 70vh; overflow-y: auto;">

            <!-- 뷰 1: 목표 상세 + 기록 목록 -->
            <div id="detailView">
                <h2 id="modalGoalName" style="font-size: 20px; margin-bottom: 4px;"></h2>
                <p class="text-sub" style="font-size: 13px; margin-bottom: 20px;">이 목표를 위해 아낀 기록이에요</p>

                <div id="modalSavingsList"></div>

                <div class="btn-row" style="margin-top: 20px;">
                    <button class="btn-sub" onclick="closeDetail()">닫기</button>
                    <button class="btn-sub text-danger" onclick="showGoalDeleteConfirm()">삭제</button>
                </div>
            </div>

            <!-- 뷰 2: 삭제 확인 (기본 숨김) -->
            <div id="deleteConfirmView" style="display: none; text-align: center;">
                <svg class="modal-icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 11v6"/>
                    <path d="M14 11v6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                    <path d="M3 6h18"/>
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                <h2 class="modal-title">이 목표를 삭제할까요?</h2>
                <p class="modal-desc">달성 기록이 사라져요</p>
                <button class="btn-danger" onclick="deleteCompletedGoal()">삭제하기</button>
                <button class="btn-sub btn-block" style="margin-top: 8px;" onclick="hideGoalDeleteConfirm()">
                    취소
                </button>
            </div>

        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");

        // 진입 가드 1차: 토큰이 아예 없으면 바로 추방
        if (!token) {
            location.href = "login.html";
        }

        async function loadHistory() {
            const historyRes = await fetch("/goals/history", {
                headers: { "Authorization": "Bearer " + token }
            });

            // 진입 가드 2차: 토큰이 있어도 무효(만료/위조)면 추방
            if (historyRes.status === 401) {
                localStorage.removeItem("token");   // 죽은 토큰 청소
                location.href = "login.html?expired=1";
                return;
            }

            const historyData = await historyRes.json();
            if (historyData.history.length === 0) {
                // 완료한 목표 없음 → 진행 중 목표가 있는지에 따라 빈 화면 문구/버튼을 다르게
                await showEmptyHistory();
                return;
            }
            document.getElementById("historySection").style.display = "block";
            loadStats();   // 히스토리 있으면 통계도 채움

            document.getElementById("historyList").innerHTML = historyData.history
                .map(h => `
                    <div onclick="openGoalDetail(${h.id}, '${h.name}')" class="history-item">

                        <!-- 1줄: 목표 이름 + 달성률 -->
                        <div style="display: flex; justify-content: space-between; align-items: baseline;">
                            <span style="font-size: 17px; font-weight: 700;">${h.name}</span>
                            <span style="font-size: 14px; font-weight: 700; color: var(--primary);">${h.progress}%</span>
                        </div>

                        <!-- 2줄: 금액 -->
                        <p style="margin-top: 6px; font-size: 15px;">
                            ${h.current_amount.toLocaleString()}원
                            <span class="text-sub">/ ${h.target_amount.toLocaleString()}원</span>
                        </p>

                        <!-- 3줄: 달성 정보 -->
                        <p class="text-sub" style="margin-top: 10px; font-size: 13px;">
                            ${h.completed_at.split(" ")[0]} 달성 ·
                            ${h.days_early > 0 ? `${h.days_early}일 빠르게 ⚡`
                                : h.days_early === 0 ? "마감일에 딱 맞춰"
                                : "끝까지 해냈어요"}
                        </p>
                    </div>

                `)
                .join("");

        }

        // 완료 목표가 없을 때의 빈 화면.
        // 진행 중 목표가 "있으면" → 홈에서 이어가라고 안내 (첫 목표 만들기는 틀린 문구)
        // 진행 중 목표가 "없으면" → 진짜 신규 → 첫 목표 만들기 그대로
        async function showEmptyHistory() {
            const currentRes = await fetch("/goals/current", {
                headers: { "Authorization": "Bearer " + token }
            });

            if (currentRes.status === 401) {
                localStorage.removeItem("token");
                location.href = "login.html?expired=1";
                return;
            }

            if (currentRes.ok) {
                // 진행 중 목표 있음 → 문구·버튼 교체
                document.getElementById("noHistorySub").textContent =
                    "진행 중인 목표를 끝까지 채우면 여기에 쌓여요";
                const btn = document.getElementById("noHistoryBtn");
                btn.textContent = "홈에서 이어가기";
                btn.onclick = () => location.href = "index.html";
            }
            // 404(진행 중 목표 없음)면 기본 문구/버튼(첫 목표 만들기 → add-goal) 그대로 둠

            document.getElementById("noHistorySection").style.display = "block";
        }

        // 카테고리별 절약 통계 — GROUP BY 결과를 막대로
        async function loadStats() {
            const res = await fetch("/savings/stats", {
                headers: { "Authorization": "Bearer " + token }
            });

            if (res.status === 401) {
                localStorage.removeItem("token");
                location.href = "login.html?expired=1";
                return;
            }

            const data = await res.json();

            // 기록이 하나도 없으면 통계 블록 자체를 숨김
            if (data.stats.length === 0) {
                document.getElementById("statsBlock").style.display = "none";
                return;
            }

            // 가장 많이 아낀 카테고리를 기준(100%)으로 나머지 막대 비율 계산
            const max = Math.max(...data.stats.map(s => s.total));

            document.getElementById("statsList").innerHTML = data.stats
                .map(s => {
                    const pct = Math.round(s.total / max * 100);
                    return `
                        <div class="stat-row">
                            <div class="stat-row-top">
                                <span>${s.category}</span>
                                <span style="font-weight: 600;">${s.total.toLocaleString()}원</span>
                            </div>
                            <div class="stat-bar">
                                <div class="stat-bar-fill" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    `;
                })
                .join("");
        }

        let selectedGoalId = null;  // 어느 목표를 삭제할지 기억

        async function openGoalDetail(goalId, goalName) {
            selectedGoalId = goalId;

            // 모달 제목 설정
            document.getElementById("modalGoalName").textContent = goalName;

            // 이 목표의 절약 기록 가져오기
            const res = await fetch(`/goals/${goalId}/savings`, {
                headers: { "Authorization": "Bearer " + token }
            });

            if (res.status === 401) {
                localStorage.removeItem("token");
                location.href = "login.html?expired=1";
                return;
            }

            const data = await res.json();

            // 기록 목록 렌더링 (없으면 안내)
            if (data.savings.length === 0) {
                document.getElementById("modalSavingsList").innerHTML =
                    `<p class="text-sub" style="text-align:center; padding: 20px 0;">기록이 없어요</p>`;
            } else {
                document.getElementById("modalSavingsList").innerHTML = data.savings
                    .map(s => `
                        <div style="display: flex; justify-content: space-between;
                                    padding: 12px 0; border-bottom: 1px solid #F1F3F5;">
                            <div>
                                <div style="font-size: 15px;">${s.category}</div>
                                ${s.memo ? `<div class="text-sub" style="font-size: 13px; margin-top: 2px;">${s.memo}</div>` : ""}
                            </div>
                            <span style="font-weight: 600; white-space: nowrap;">+${s.amount.toLocaleString()}원</span>
                        </div>
                    `)
                    .join("");
            }

            // 모달 열기
            document.getElementById("detailModal").style.display = "flex";
        }

        let isDeletingCompletedGoal = false;

        async function deleteCompletedGoal() {
            if (isDeletingCompletedGoal) return;
            isDeletingCompletedGoal = true;

            try {
                const res = await fetch(`/goals/${selectedGoalId}`,{
                    method: "DELETE",
                    headers: { "Authorization": "Bearer " + token }
                });

                if (res.status === 401) {
                    localStorage.removeItem("token");
                    location.href = "login.html?expired=1";
                    return;
                }

                if (res.ok) {
                    location.reload();
                }
            } finally {
                isDeletingCompletedGoal = false;
            }
        }

        function closeDetail() {
            document.getElementById("detailModal").style.display = "none";
            hideGoalDeleteConfirm();
        }
        function showGoalDeleteConfirm() {
            document.getElementById("detailView").style.display = "none";
            document.getElementById("deleteConfirmView").style.display = "block";
        }

        function hideGoalDeleteConfirm() {
            document.getElementById("deleteConfirmView").style.display = "none";
            document.getElementById("detailView").style.display = "block";
        }

        loadHistory();   // 페이지 열리면 즉시 실행
    </script>
</body>
</html>
