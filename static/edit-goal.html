<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>목표수정</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="header-btn" onclick="history.back()">←</button>
        </div>

        <!-- 로딩 중: 데이터 오기 전까지 스피너만 (빈 폼 번쩍임 방지) -->
        <div id="loading"><div class="spinner"></div></div>

        <!-- 폼: 데이터 채운 뒤에 표시 -->
        <div id="editForm" style="display: none;">
            <!-- 타이틀 영역 -->
            <div style="margin-top: 24px; margin-bottom: 36px;">
                <h1 class="title-lg">목표를<br>수정할까요?</h1>
                <p class="text-sub" style="margin-top: 12px;">목표를 정하면 저금통이 시작돼요</p>
            </div>

            <!-- 입력 폼 영역 (form 태그 대신 div: 버튼의 자동 submit 동작 방지) -->
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label class="field-label">목표 이름</label>
                    <input class="input" type="text" id="name" placeholder="">
                </div>
                <div>
                    <label class="field-label">목표 금액</label>
                    <input class="input" type="text" id="targetAmount" placeholder="숫자만 입력" inputmode="numeric">
                </div>
                <div>
                    <label class="field-label">마감일</label>
                    <input class="input" type="date" id="deadline">
                </div>
                <!-- 에러 문구 자리 (평소엔 비어 있고, JS가 상황별 문구를 채움) -->
                <p class="error-msg" id="errorMsg"></p>
                <button class="btn-primary" onclick="edit_goal()">목표 수정</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");

        // 진입 가드 1차: 토큰이 아예 없으면 바로 추방
        if (!token) {
            location.href = "login.html";
        }
        async function loadCurrentGoal() {
            const res = await fetch("/goals/current", {
                headers: { "Authorization": "Bearer " + token }
            });
            if (!res.ok) {
                location.href = "index.html";   // 목표 없으면 수정할 것도 없음
                return;
            }
            const goal = await res.json();

            document.getElementById("name").value = goal.name;
            document.getElementById("targetAmount").value = goal.target_amount.toLocaleString();
            document.getElementById("deadline").value = goal.deadline;

            // 값을 다 채운 뒤에야 스피너를 감추고 폼을 보여줌
            document.getElementById("loading").style.display = "none";
            document.getElementById("editForm").style.display = "block";
        }
        loadCurrentGoal();

        let isEditingGoal = false;

        async function edit_goal() {
            if (isEditingGoal) return;
            isEditingGoal = true;

            try {
                // 입력창에서 현재 값 읽기
                const nameInput = document.getElementById("name").value.trim();
                const amountInput = document.getElementById("targetAmount").value.replace(/,/g, "");
                const deadlineInput = document.getElementById("deadline").value;

                // 셋 다 비었으면 보낼 이유가 없음
                if (!nameInput && !amountInput && !deadlineInput) {
                    document.getElementById("errorMsg").textContent = "수정할 내용을 입력해주세요";
                    return;
                }

                const body = {
                    name: nameInput || null,
                    target_amount: amountInput ? parseInt(amountInput) : null,
                    deadline: deadlineInput || null
                };

                const response = await fetch("/goals/current", {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify(body)
                });

                if (response.status === 401) {
                    localStorage.removeItem("token");   // 죽은 토큰 청소
                    location.href = "login.html?expired=1";
                    return;
                }

                if (response.ok) {
                    location.href = "index.html";
                } else {
                    const data = await response.json();
                    document.getElementById("errorMsg").textContent = data.detail;
                }
            } finally {
                isEditingGoal = false;
            }
        }
        // 금액 입력 시 실시간 콤마 표시
        document.getElementById("targetAmount").addEventListener("input", (e) => {
            // 숫자만 남기고 (콤마·문자 제거) → 다시 콤마 찍기
            let digits = e.target.value.replace(/[^0-9]/g, "");
            e.target.value = digits ? parseInt(digits).toLocaleString() : "";
        });
        document.getElementById("name").addEventListener("keydown", (e) => {
            if (e.key === "Enter") edit_goal();
        });
        document.getElementById("targetAmount").addEventListener("keydown", (e) => {
            if (e.key === "Enter") edit_goal();
        });
        document.getElementById("deadline").addEventListener("keydown", (e) => {
            if (e.key === "Enter") edit_goal();
        });

    </script>
</body>
</html>
